name: Test on Pull Request
on:
  pull_request:
    branches:
      - develop
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.xaml'

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OpenOverlays.sln

      - name: Build
        run: dotnet build OpenOverlays.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenOverlays.sln --configuration Release --no-build --verbosity normal